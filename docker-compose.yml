version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agenda_clinica_db
    environment:
      POSTGRES_USER: agenda_user
      POSTGRES_PASSWORD: agenda_pass
      POSTGRES_DB: agenda_clinica
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda_user -d agenda_clinica"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: agenda_clinica_api
    environment:
      DATABASE_URL: "postgresql://agenda_user:agenda_pass@db:5432/agenda_clinica"
      SECRET_KEY: "development-secret-key-change-in-production"
      DEBUG: "true"
      ENVIRONMENT: "development"
      DB_ECHO: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./models:/app/models
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.presentacion.api_rest.main:app --host 0.0.0.0 --port 8000 --reload"

  redis:
    image: redis:7-alpine
    container_name: agenda_clinica_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
